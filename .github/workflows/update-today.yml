name: Aggiorna Partite Oggi

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6,9,12,15,18,21 * * *"

permissions:
  contents: write

concurrency:
  group: spiderweb-partite-oggi
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_BOOKMAKERS: "Bet365,Unibet"
      ODDS_API_IO_MAX_CALLS: "24"
      SPIDERWEB_RADAR_VERSION: "api-football-plus-oddsapiio-v5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Diagnostica input radar
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Radar: $SPIDERWEB_RADAR_VERSION"
          ls -lh data/output/live_training.csv data/output/backtest_multisource_stable.csv || true

      - name: Stato configurazione fonti
        id: api_key
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API_FOOTBALL_KEY non configurata."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "API-Football configurata."
          fi
          if [ -z "$ODDS_API_IO_KEY" ]; then
            echo "::warning::ODDS_API_IO_KEY non ancora configurata: userò il radar attuale."
          else
            echo "Odds-API.io configurata: attivo fallback quote."
          fi

      - name: Aggiorna radar mondiale e schedine
        if: steps.api_key.outputs.configured == 'true'
        run: python src/update_today_oddsapiio.py

      - name: Verifica output radar
        if: steps.api_key.outputs.configured == 'true'
        run: |
          test -s data/output/today.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/output/today.json').read_text(encoding='utf-8'))
          print('Data:', d.get('date'))
          print('Fonte:', d.get('source'))
          print('Partite mondiali scansionate:', d.get('fixtures_count'))
          print('Con storico compatibile:', d.get('eligible_history_count'))
          print('Leghe target oggi:', d.get('target_leagues_today'))
          print('Eventi Odds-API.io:', d.get('odds_api_events_today'))
          print('Quote abbinate Odds-API.io:', d.get('odds_api_matches'))
          print('Richieste Odds-API.io:', d.get('odds_api_calls_used'))
          print('Con quote:', d.get('fixtures_with_odds'))
          print('Candidati:', d.get('candidate_count'))
          if int(d.get('fixtures_count') or 0) <= 3:
              raise SystemExit('Radar mondiale ha restituito 3 o meno partite')
          PY

      - name: Salva dati aggiornati
        if: steps.api_key.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/today.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna radar mondiale e schedine"
            git pull --rebase origin main
            git push
          fi
