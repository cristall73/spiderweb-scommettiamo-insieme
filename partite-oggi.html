<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f">
<title>Partite Oggi - SpiderWeb</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#050b14;color:#f5f7fb}.hero{background:radial-gradient(ellipse at 50% 0,#173250 0,#091728 40%,#050b14 78%);padding:22px 16px}.brand{text-align:center}.brand h1{margin:0;font-size:clamp(34px,6vw,58px)}.brand .tag{color:#ffc107;font-weight:900;letter-spacing:4px}.nav{max-width:1100px;margin:18px auto 0;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #1b3859;border-radius:10px;overflow:hidden;background:#08192b}.nav a{padding:14px;text-align:center;color:#e7edf5;text-decoration:none;font-weight:800;border-right:1px solid #18304a}.nav a:last-child{border-right:0}.nav a.active{color:#ffc107;background:#0c2036;box-shadow:inset 0 -3px #ffc107}.wrap{max-width:1100px;margin:auto;padding:18px 16px 40px}.panel{border:1px solid #17314e;background:linear-gradient(180deg,#0b1d31,#07111e);border-radius:12px;padding:24px;margin-bottom:16px}.title{text-align:center;font-size:28px;margin:0 0 18px}.title:after{content:"";display:block;width:55px;height:3px;background:#ffc107;margin:8px auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{background:#0b1725;border:1px solid #26384c;border-radius:10px;padding:18px;text-align:center}.metric b{font-size:30px;display:block;margin-top:4px}.ok{color:#45dc72}.warn{color:#ffc107}.muted{color:#9caabc}.signal{border:1px solid #2a4562;background:#091827;border-radius:10px;padding:18px;margin-top:12px}.signal.strong{border-color:#29c85b}.signal.test{border-color:#d2a500}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.league{font-size:12px;color:#9fc9ff;text-transform:uppercase;font-weight:800}.match{font-size:21px;font-weight:900;margin:5px 0}.badge{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;background:#173b2b;color:#65e38c;white-space:nowrap}.badge.test{background:#3b3215;color:#ffd95a}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:15px}.cell{border-top:1px solid #294059;padding-top:10px;text-align:center}.cell span{display:block;color:#94a2b5;font-size:11px;text-transform:uppercase}.cell b{display:block;margin-top:4px;font-size:18px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 9px;border-bottom:1px solid #22364b;text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:11px;color:#9caabd;text-transform:uppercase}.empty{text-align:center;padding:34px 16px;color:#bdc8d5}.note{font-size:13px;color:#9eacbc;line-height:1.5}.stamp{text-align:center;color:#8fa1b7;font-size:12px;margin-top:12px}@media(max-width:760px){.summary{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:1fr 1fr}.top{flex-direction:column}}
</style>
</head>
<body>
<header class="hero"><div class="brand"><h1>SPIDERWEB</h1><div class="tag">SCOMMETTIAMO INSIEME</div></div><nav class="nav"><a href="index.html">HOME</a><a href="index.html#backtest">BACKTEST</a><a class="active" href="partite-oggi.html">⚽ PARTITE OGGI</a><a href="index.html#statistiche">STATISTICHE</a></nav></header>
<main class="wrap">
<section class="panel"><h2 class="title">Partite Oggi</h2><div class="summary"><div class="metric"><span class="muted">Partite analizzate</span><b id="count">—</b></div><div class="metric"><span class="muted">Segnali trovati</span><b id="signals" class="ok">—</b></div><div class="metric"><span class="muted">Data</span><b id="date" style="font-size:22px">—</b></div></div><div class="stamp" id="stamp"></div></section>
<section class="panel"><h2 class="title">Occasioni che superano i filtri</h2><div id="signalsBox" class="empty">Caricamento...</div></section>
<section class="panel"><h2 class="title">Tutte le partite analizzate</h2><div class="table" id="allBox"><div class="empty">Caricamento...</div></div><p class="note" id="note"></p></section>
</main>
<script>
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';
fetch('data/output/today.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error('Dati non disponibili');return r.json()}).then(d=>{
 document.getElementById('count').textContent=d.fixtures_count??0;document.getElementById('signals').textContent=d.signals_count??0;document.getElementById('date').textContent=d.date||'—';document.getElementById('stamp').textContent=d.generated_at?'Ultimo aggiornamento: '+new Date(d.generated_at).toLocaleString('it-IT'):'In attesa del primo aggiornamento';document.getElementById('note').textContent=d.note||'';
 const sb=document.getElementById('signalsBox');
 if(!d.signals||!d.signals.length){sb.className='empty';sb.innerHTML='<strong>Nessuna giocata oggi.</strong><br><span class="muted">Nessuna partita supera i filtri validati. Nessun segnale forzato.</span>'} else {sb.className='';sb.innerHTML=d.signals.map(x=>`<div class="signal ${x.status==='VALIDATA_FORTE'?'strong':'test'}"><div class="top"><div><div class="league">${x.league} · ${x.time||''}</div><div class="match">${x.home_team} – ${x.away_team}</div><div class="muted">${x.rule}</div></div><div class="badge ${x.status==='IN_TEST'?'test':''}">${x.status.replaceAll('_',' ')}</div></div><div class="grid"><div class="cell"><span>Pronostico</span><b>${x.selection}</b></div><div class="cell"><span>Quota rif.</span><b>${x.odds??'—'}</b></div><div class="cell"><span>Prob. modello</span><b>${pct(x.model_probability)}</b></div><div class="cell"><span>Prob. mercato</span><b>${pct(x.market_probability)}</b></div><div class="cell"><span>Edge</span><b class="ok">${pct(x.edge)}</b></div></div></div>`).join('')}
 const rows=(d.matches||[]).map(x=>`<tr><td>${x.league}<br><span class="muted">${x.home_team} – ${x.away_team}</span></td><td>${x.time||'—'}</td><td>${x.selection}</td><td>${x.odds??'—'}</td><td>${pct(x.model_probability)}</td><td>${pct(x.edge)}</td><td>${x.status.replaceAll('_',' ')}</td></tr>`).join('');document.getElementById('allBox').innerHTML=rows?`<table><thead><tr><th>Partita</th><th>Ora</th><th>Esito</th><th>Quota</th><th>Prob. modello</th><th>Edge</th><th>Stato</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Nessuna partita disponibile per oggi nei 5 campionati analizzati.</div>';
}).catch(e=>{document.getElementById('signalsBox').innerHTML='Errore caricamento dati: '+e.message;document.getElementById('allBox').innerHTML='Errore caricamento dati.'});
</script>
</body></html>
