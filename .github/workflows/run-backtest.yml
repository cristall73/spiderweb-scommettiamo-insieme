name: Backtest calcio multi-mercato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/run-backtest.yml"

concurrency:
  group: backtest-calcio-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scarica e prepara storico Football-Data
        run: |
          python src/download_football_data.py
          python src/build_dataset.py
          python src/build_features.py

      - name: Backtest e validazioni 1X2
        run: |
          python src/backtest_1x2.py
          python src/analyze_backtest.py
          python src/walk_forward_1x2.py

      - name: Benchmark mercati goal
        run: python src/backtest_markets.py

      - name: Over Under con quote Football-Data reali
        run: python src/backtest_ou_real.py

      - name: Walk-forward multi-fonte Over Under e BTTS
        run: python src/backtest_multisource_real.py

      - name: Salva risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/*.csv
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai risultati"
          else
            git commit -m "Aggiorna ricerca multi-fonte OU e BTTS"
            git pull --rebase origin main
            git push origin main
          fi
