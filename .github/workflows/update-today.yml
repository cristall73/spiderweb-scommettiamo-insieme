name: Aggiorna Partite Oggi

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6,9,12,15,18,21 * * *"

permissions:
  contents: write

concurrency:
  group: spiderweb-partite-oggi
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SPIDERWEB_RADAR_VERSION: "min-acceptable-odds-v6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Diagnostica input radar
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Radar: $SPIDERWEB_RADAR_VERSION"
          ls -lh data/output/live_training.csv data/output/backtest_multisource_stable.csv || true

      - name: Stato configurazione API-Football
        id: api_key
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API_FOOTBALL_KEY non configurata."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "API-Football configurata: uso calendario mondiale multisorgente."
          fi

      - name: Correggi endpoint calendario Sofascore
        if: steps.api_key.outputs.configured == 'true'
        run: sed -i 's#https://www.sofascore.com/api/v1/#https://api.sofascore.com/api/v1/#g' src/update_today_min_odds.py

      - name: Calcola candidati e quota minima
        if: steps.api_key.outputs.configured == 'true'
        run: python src/update_today_min_odds.py

      - name: Verifica output radar
        if: steps.api_key.outputs.configured == 'true'
        run: |
          test -s data/output/today.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/output/today.json').read_text(encoding='utf-8'))
          print('Data:', d.get('date'))
          print('Fonte:', d.get('source'))
          print('Partite mondiali scansionate:', d.get('fixtures_count'))
          print('API-Football:', d.get('api_football_fixtures_count'))
          print('Football-Data righe:', d.get('football_data_rows_today'))
          print('Sofascore righe:', d.get('sofascore_rows_today'))
          print('Sofascore aggiunte:', d.get('sofascore_calendar_added'))
          print('Con storico compatibile:', d.get('eligible_history_count'))
          print('Candidati con quota minima:', d.get('candidate_count'))
          s=d.get('single') or {}
          if s:
              print('Migliore:', s.get('home_team'), '-', s.get('away_team'), s.get('selection'), 'quota minima', s.get('min_acceptable_odds'))
          print('Richieste API rimaste:', d.get('api_requests_remaining'))
          if int(d.get('fixtures_count') or 0) <= 3:
              raise SystemExit('Radar mondiale ha restituito 3 o meno partite')
          PY

      - name: Salva dati aggiornati
        if: steps.api_key.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/today.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna radar quota minima"
            git pull --rebase origin main
            git push
          fi
