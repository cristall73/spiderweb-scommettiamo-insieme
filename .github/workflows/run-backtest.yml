name: Primo backtest 1X2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/run-backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Scarica dati storici
        run: python src/download_football_data.py
      - name: Costruisci dataset
        run: python src/build_dataset.py
      - name: Costruisci feature pre-match
        run: python src/build_features.py
      - name: Esegui backtest 1X2
        run: python src/backtest_1x2.py
      - name: Analizza segmenti e filtri stabili
        run: python src/analyze_backtest.py
      - name: Validazione walk-forward
        run: python src/walk_forward_1x2.py
      - name: Salva risultati nella repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/backtest_1x2.csv data/output/backtest_1x2_summary.csv data/output/backtest_segments.csv data/output/backtest_stable_filters.csv data/output/walk_forward_1x2.csv data/output/walk_forward_summary.csv
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai risultati"
          else
            git commit -m "Aggiorna risultati, segmenti e walk-forward 1X2"
            git push
          fi
