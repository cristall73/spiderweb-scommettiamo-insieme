name: Backtest calcio globale multi-mercato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/run-backtest.yml"

concurrency:
  group: spiderweb-data-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scarica storico esteso Football-Data
        run: python src/download_football_data.py

      - name: Walk-forward globale Over Under e BTTS
        run: python src/backtest_multisource_real.py

      - name: Prepara storico compatto per radar live
        run: python src/export_live_history.py

      - name: Salva risultati globali e storico live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Conserva solo gli output generati prima di riallineare il checkout.
          output_dir=$(mktemp -d)
          files=(data/output/backtest_multisource_real.csv data/output/backtest_multisource_summary.csv data/output/backtest_multisource_stable.csv data/output/live_training.csv)
          for file in "${files[@]}"; do cp "$file" "$output_dir/$(basename "$file")"; done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do cp "$output_dir/$(basename "$file")" "$file"; done
            git add -f -- "${files[@]}"
            if git diff --cached --quiet; then
              echo "Nessuna modifica ai risultati"
              exit 0
            fi
            git commit -m "Aggiorna backtest globale e storico live"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Repository aggiornato durante il salvataggio: nuovo tentativo $attempt/5"
          done
          echo "::error::Impossibile pubblicare i risultati dopo 5 tentativi"
          exit 1

      - name: Nota radar live
        run: |
          echo "Il radar Partite Oggi viene aggiornato dal workflow dedicato Aggiorna Partite Oggi tramite API-Football."
          echo "Il backtest non dipende più da SofaScore, quindi un 403 del provider non blocca i risultati statistici."
