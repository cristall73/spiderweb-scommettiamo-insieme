name: Backtest calcio globale multi-mercato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/run-backtest.yml"

concurrency:
  group: backtest-calcio-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scarica storico esteso Football-Data
        run: python src/download_football_data.py

      - name: Walk-forward globale Over Under e BTTS
        run: python src/backtest_multisource_real.py

      - name: Prepara storico compatto per radar live
        run: python src/export_live_history.py

      - name: Salva risultati globali
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/backtest_multisource_real.csv
          git add -f data/output/backtest_multisource_summary.csv
          git add -f data/output/backtest_multisource_stable.csv
          git add -f data/output/live_training.csv
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai risultati"
          else
            git commit -m "Aggiorna backtest globale e storico live"
            git pull --rebase origin main
            git push origin main
          fi
