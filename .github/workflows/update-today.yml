name: Aggiorna Partite Oggi

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6,9,12,15,18,21 * * *"

permissions:
  contents: write

concurrency:
  group: spiderweb-partite-oggi
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
      SPIDERWEB_RADAR_VERSION: "min-acceptable-odds-v9-safe-multicalendar"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Diagnostica input radar
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Radar: $SPIDERWEB_RADAR_VERSION"
          ls -lh data/output/live_training.csv data/output/backtest_multisource_stable.csv || true

      - name: Stato configurazione fonti
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::API_FOOTBALL_KEY non configurata."
          else
            echo "API-Football configurata; se sospesa il radar prosegue con i fallback."
          fi
          if [ -z "$FOOTBALL_DATA_ORG_TOKEN" ]; then
            echo "::notice::football-data.org non ancora configurato: il radar continua con le altre fonti."
          else
            echo "football-data.org configurato."
          fi
          echo "Sofascore: massimo una sola richiesta calendario per run, senza retry o bypass."

      - name: Calcola candidati e quota minima
        run: python src/update_today_multisource.py

      - name: Verifica output radar
        run: |
          test -s data/output/today.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          d=json.loads(Path('data/output/today.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('Europe/Rome')).date().isoformat()
          print('Data:', d.get('date'))
          print('Fonte:', d.get('source'))
          print('Partite mondiali scansionate:', d.get('fixtures_count'))
          print('API-Football:', d.get('api_football_fixtures_count'))
          print('Football-Data righe:', d.get('football_data_rows_today'))
          print('Calendari fallback righe:', d.get('sofascore_rows_today'))
          print('Calendari fallback aggiunte:', d.get('sofascore_calendar_added'))
          print('Con storico compatibile:', d.get('eligible_history_count'))
          print('Candidati con quota minima:', d.get('candidate_count'))
          s=d.get('single') or {}
          if s:
              print('Migliore:', s.get('home_team'), '-', s.get('away_team'), s.get('selection'), 'quota minima', s.get('min_acceptable_odds'))
          print('Richieste API rimaste:', d.get('api_requests_remaining'))
          if d.get('date') != today:
              raise SystemExit(f'Output non aggiornato: atteso {today}, trovato {d.get("date")}')
          if int(d.get('fixtures_count') or 0) <= 3:
              print('::warning::Copertura calendario molto bassa: salvo comunque il file di oggi per non mostrare sul sito le giocate di ieri.')
          PY

      - name: Salva dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/output/today.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna radar quota minima"
            git pull --rebase --autostash origin main
            git push
          fi
