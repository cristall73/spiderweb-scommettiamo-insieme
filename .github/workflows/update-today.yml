name: Aggiorna Partite Oggi

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-today.yml"
  schedule:
    # Scheduler refresh: 2026-08-31
    # Cinque tentativi automatici al giorno, circa ogni ora dalla mattina.
    # Il primo che aggiorna correttamente salva today.json con la data odierna.
    # I tentativi automatici successivi vedono la data gia aggiornata e NON chiamano le API.
    # GitHub Actions usa UTC. Con ora legale italiana (UTC+2):
    # 08:13 UTC = 10:13, 09:17 = 11:17, 10:23 = 12:23, 11:31 = 13:31, 12:41 = 14:41.
    # Minuti volutamente non tondi per ridurre ritardi/skip dello scheduler GitHub.
    - cron: "13 8 * * *"
    - cron: "17 9 * * *"
    - cron: "23 10 * * *"
    - cron: "31 11 * * *"
    - cron: "41 12 * * *"

permissions:
  contents: write

concurrency:
  group: spiderweb-partite-oggi
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
      FOOTBALLDATA_IO_KEY: ${{ secrets.FOOTBALLDATA_IO_KEY }}
      SPIDERWEB_RADAR_VERSION: "min-acceptable-odds-v11-local-history-map"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica se oggi e gia aggiornato
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule':
              p = Path('data/output/today.json')
              if p.exists():
                  try:
                      d = json.loads(p.read_text(encoding='utf-8'))
                      today = datetime.now(ZoneInfo('Europe/Rome')).date().isoformat()
                      if d.get('date') == today:
                          should_run = False
                          print(f'Dati gia aggiornati per {today}: questo tentativo di sicurezza non fara chiamate API.')
                  except Exception as e:
                      print(f'Impossibile verificare la freschezza ({e}); procedo con aggiornamento.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'should_run={str(should_run).lower()}\n')
          PY

      - name: Python
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        if: steps.freshness.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Diagnostica input radar
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Radar: $SPIDERWEB_RADAR_VERSION"
          ls -lh data/output/live_training.csv data/output/backtest_multisource_stable.csv || true

      - name: Stato configurazione fonti
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::API_FOOTBALL_KEY non configurata."
          else
            echo "API-Football configurata; se sospesa il radar prosegue con i fallback."
          fi
          if [ -z "$FOOTBALL_DATA_ORG_TOKEN" ]; then
            echo "::notice::football-data.org non configurato."
          else
            echo "football-data.org configurato."
          fi
          if [ -z "$FOOTBALLDATA_IO_KEY" ]; then
            echo "::notice::Footballdata.io non configurato."
          else
            echo "Footballdata.io configurato: massimo una richiesta /fixtures/today per run."
          fi
          echo "Sofascore: massimo una sola richiesta calendario per run, senza retry o bypass."
          echo "Mapping storico locale: nessuna richiesta API aggiuntiva; solo match univoci con entrambe le squadre nello stesso storico."

      - name: Calcola candidati e quota minima
        if: steps.freshness.outputs.should_run == 'true'
        run: python src/run_today_local_mapping.py

      - name: Verifica output radar
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          test -s data/output/today.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          d=json.loads(Path('data/output/today.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('Europe/Rome')).date().isoformat()
          print('Data:', d.get('date'))
          print('Fonte:', d.get('source'))
          print('Partite mondiali scansionate:', d.get('fixtures_count'))
          print('API-Football:', d.get('api_football_fixtures_count'))
          print('Football-Data righe:', d.get('football_data_rows_today'))
          print('Calendari fallback righe:', d.get('sofascore_rows_today'))
          print('Calendari fallback aggiunte:', d.get('sofascore_calendar_added'))
          print('Con storico compatibile:', d.get('eligible_history_count'))
          print('Candidati con quota minima:', d.get('candidate_count'))
          s=d.get('single') or {}
          if s:
              print('Migliore:', s.get('home_team'), '-', s.get('away_team'), s.get('selection'), 'quota minima', s.get('min_acceptable_odds'))
          print('Richieste API rimaste:', d.get('api_requests_remaining'))
          if d.get('date') != today:
              raise SystemExit(f'Output non aggiornato: atteso {today}, trovato {d.get("date")}')
          if int(d.get('fixtures_count') or 0) <= 3:
              print('::warning::Copertura calendario molto bassa: salvo comunque il file di oggi per non mostrare sul sito le giocate di ieri.')
          PY

      - name: Salva dati aggiornati
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          cp data/output/today.json /tmp/today.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/today.json data/output/today.json
          git add -f data/output/today.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna radar quota minima"
            git push origin HEAD:main
          fi
