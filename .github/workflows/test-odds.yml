name: Test quote API-Football

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Verifica disponibilita quote senza mostrare la chiave
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          key = os.environ.get("API_FOOTBALL_KEY", "").strip()
          if not key:
              raise SystemExit("ERRORE: secret API_FOOTBALL_KEY assente.")
          base = "https://v3.football.api-sports.io"
          headers = {"x-apisports-key": key, "Accept": "application/json"}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, {}
          # Massimo 1 richiesta calendario + 5 richieste quote, senza paginazione.
          date = (datetime.now(ZoneInfo("Europe/Rome")) + timedelta(days=1)).date().isoformat()
          status, fixtures = get("/fixtures?date=" + date + "&timezone=Europe%2FRome")
          print("Calendario: HTTP", status, "partite:", len(fixtures.get("response") or []))
          if status != 200 or fixtures.get("errors"):
              print("Errore calendario:", json.dumps(fixtures.get("errors") or {}, ensure_ascii=False)[:300])
              raise SystemExit(1)
          priority = {39, 140, 135, 78, 61, 94, 88, 2, 3, 45, 40, 136, 79, 62}
          candidates = [item for item in fixtures.get("response") or []
                        if (item.get("fixture") or {}).get("id")
                        and ((item.get("fixture") or {}).get("status") or {}).get("short") == "NS"]
          candidates.sort(key=lambda item: (0 if (item.get("league") or {}).get("id") in priority else 1,
                                            (item.get("fixture") or {}).get("timestamp") or 0))
          print("Partite future:", len(candidates), "tentativi quote massimo:", min(5, len(candidates)))
          found = False
          for index, item in enumerate(candidates[:5], 1):
              fixture_id = item["fixture"]["id"]
              teams = item.get("teams") or {}
              print("Tentativo", index, "partita:", (teams.get("home") or {}).get("name"),
                    "-", (teams.get("away") or {}).get("name"))
              status, odds = get("/odds?fixture=" + str(fixture_id))
              response = odds.get("response") or []
              bookmakers = [b for event in response for b in event.get("bookmakers") or []]
              markets = sum(len(b.get("bets") or []) for b in bookmakers)
              print("Quote: HTTP", status, "eventi:", len(response),
                    "bookmaker:", len(bookmakers), "mercati:", markets)
              if odds.get("errors"):
                  print("Errori API:", json.dumps(odds["errors"], ensure_ascii=False)[:300])
              if status != 200 or odds.get("errors"):
                  print("Test interrotto: errore endpoint quote, nessun'altra richiesta.")
                  break
              if bookmakers:
                  found = True
                  for bookmaker in bookmakers[:2]:
                      print("Bookmaker:", bookmaker.get("name"))
                      for bet in (bookmaker.get("bets") or [])[:2]:
                          print("Mercato:", bet.get("name"), "esempi:",
                                [(v.get("value"), v.get("odd")) for v in (bet.get("values") or [])[:3]])
                  break
          print("ESITO:", "QUOTE REALI DISPONIBILI" if found else
                "NESSUNA QUOTA TROVATA NEI TENTATIVI; non significa che il piano non le includa.")
          PY
